services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

  ai-nieuwssite:
    build:
      context: https://github.com/iitssjstn/ai-nieuwssite.git#main
    container_name: ai-nieuwssite
    restart: unless-stopped
    environment:
      - ADMIN_HOSTNAME=admin.novapers.nl
      # SESSION_SECRET is optioneel: laat je 'm weg, dan genereert de
      # container er zelf één bij de eerste start en bewaart die in het
      # data-volume. De Google API-key en het admin-wachtwoord stel je
      # helemaal in via de website zelf (admin.novapers.nl/login) — daar
      # is niets voor nodig in dit bestand.
    volumes:
      - ./ai-nieuwssite-data:/app/data
